name: Build

on:
  push:
    branches: [master, refactor/*]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate-script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MyClaw
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Migration script tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout MyClaw
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure clippy
        run: rustup component add clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install libclang (for silk-rs bindgen)
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update && sudo apt-get install -y libclang-dev clang


      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build Release
        run: cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: myclaw-linux-x86_64
          path: target/release/myclaw
          retention-days: 7
